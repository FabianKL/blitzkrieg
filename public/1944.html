<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BLITZKRIEG — zomer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Stencil+One&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c1a16;
      --frame: #34342b;
      --cream: #e6dcc2;
      --gold: #d2a431;
      --stamp: #d8473a;
      --paper: #d8cba5;
      --paper-edge: #8c7f5b;
      --ink: #3b3a22;
      --olive: #4e5a26;
      --rust: #8a3a24;
      --brass: #a2802c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #25221c 0%, var(--bg) 70%);
      color: var(--cream);
      font-family: "Special Elite", "Courier New", monospace;
      display: flex; flex-direction: column;
      padding: 14px 18px 16px;
      overflow: hidden;
    }
    header { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; flex: none; }
    h1 {
      margin: 0; font-family: "Saira Stencil One", "Black Ops One", Impact, sans-serif; font-weight: 400;
      font-size: 40px; letter-spacing: 6px; color: var(--cream); line-height: 1;
    }
    .year { font-family: "Black Ops One", Impact, sans-serif; color: var(--gold); font-size: 18px; letter-spacing: 3px; }
    .spacer { flex: 1; }
    .sector { font-size: 14px; letter-spacing: 1px; }
    .stamp {
      font-family: "Black Ops One", Impact, sans-serif; color: var(--stamp); border: 2px solid var(--stamp);
      padding: 3px 10px; font-size: 14px; letter-spacing: 2px; transform: rotate(-3deg); display: inline-block;
    }
    .switch { color: #9a927c; font-size: 12px; text-decoration: none; border-bottom: 1px dotted #6d675a; }
    .switch:hover { color: var(--cream); }

    main { flex: 1; min-height: 0; display: flex; gap: 0; }
    .panel {
      position: relative; flex: 1; min-width: 0;
      border: 6px solid var(--frame);
      box-shadow: inset 0 0 0 1px #4a4a3c, 0 0 0 1px #121210, inset 0 0 40px rgba(0,0,0,.6);
      background: #2a1f17;
    }
    .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .panel::after { /* vignet over het speelveld */
      content: ""; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 60px rgba(0,0,0,.55);
    }
    .ploeg {
      position: absolute; top: 12px; right: 16px; z-index: 2; pointer-events: none;
      font-family: "Black Ops One", Impact, sans-serif; font-size: 13px; letter-spacing: 3px; color: #f1ead6;
      text-shadow: 0 1px 2px #000;
    }
    .overlay {
      position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; text-align: center;
    }
    .overlay .big {
      font-family: "Black Ops One", Impact, sans-serif; font-size: 44px; letter-spacing: 6px; color: var(--stamp);
      border: 4px solid var(--stamp); padding: 6px 22px; transform: rotate(-4deg); background: rgba(20,16,12,.55);
    }
    .overlay .small { margin-top: 14px; font-size: 16px; color: var(--cream); text-shadow: 0 1px 3px #000; }
    .overlay:empty { display: none; }

    .caution {
      flex: none; width: 14px; margin: 0 16px;
      background: repeating-linear-gradient(-45deg, #e7c22b 0 9px, #15140f 9px 18px);
      border: 1px solid #0c0c0a;
    }
    aside { flex: none; width: 300px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
    .card {
      background: linear-gradient(180deg, #ddd1ad, var(--paper));
      border: 2px solid var(--paper-edge);
      box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px #b3a57e, 0 2px 0 #0e0d0b;
      color: var(--ink); padding: 12px 14px; position: relative;
    }
    .card.me { box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px #b3a57e, 0 0 0 2px var(--gold), 0 2px 0 #0e0d0b; }
    .card .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .card .name { font-family: "Black Ops One", Impact, sans-serif; font-size: 20px; letter-spacing: 2px; color: #3a4320; }
    .card .wins { text-align: right; font-size: 11px; letter-spacing: 1px; }
    .card .wins b { display: block; font-family: "Black Ops One", Impact, sans-serif; font-size: 24px; font-weight: 400; line-height: 1; }
    .card .row { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; margin-top: 4px; }
    .card .track { height: 9px; background: #c9b98e; border: 1px solid #7e7150; box-shadow: inset 0 1px 0 rgba(0,0,0,.15); }
    .card .fill { height: 100%; transition: width .15s linear; }
    .card .fill.low { animation: blink .5s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .card .tag {
      position: absolute; top: -9px; left: 12px; background: var(--gold); color: #1c1a16;
      font-family: "Black Ops One", Impact, sans-serif; font-size: 10px; letter-spacing: 2px; padding: 1px 6px;
    }
    .card.dead { filter: grayscale(.7) brightness(.8); }
    /* schakelaar in de stijl van een papieren kaartje */
    .toggle {
      display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
      font-family: "Black Ops One", Impact, sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--cream);
    }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle span {
      flex: none; width: 38px; height: 20px; border: 2px solid var(--paper-edge); background: #2a2822; position: relative;
    }
    .toggle span::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #8c7f5b; transition: left .15s;
    }
    .toggle input:checked + span { background: var(--olive); }
    .toggle input:checked + span::after { left: 20px; background: var(--paper); }
    .toggle input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
    .legend { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; }
    .legend-row { display: contents; }
    .legend-swatch { width: 22px; height: 22px; image-rendering: pixelated; border: 1px solid var(--paper-edge); }
    .legend-name { font-size: 12px; line-height: 1.2; color: var(--cream); }
    .legend-note { font-size: 11px; white-space: nowrap; text-align: right; color: #9a927c; }
    #mini { width: 100%; aspect-ratio: 8 / 5; display: block; border: 2px solid var(--paper-edge); box-shadow: 0 0 0 1px #000; background: #000; }
    .legend-title { font-family: "Black Ops One", Impact, sans-serif; font-size: 13px; letter-spacing: 3px; color: var(--gold); margin-top: 6px; }
    .help { margin-top: auto; font-size: 12px; color: #9a927c; line-height: 1.6; }
    .net { font-size: 11px; color: #6d675a; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      main { flex-direction: column; }
      .panel { min-height: 60vh; }
      .caution { width: auto; height: 12px; margin: 12px 0; background: repeating-linear-gradient(-45deg, #e7c22b 0 9px, #15140f 9px 18px); }
      aside { width: auto; }
      h1 { font-size: 28px; }
      .sector { display: none; }
    }
  </style>
  <link rel="stylesheet" href="/touch.css">
</head>
<body>
  <!-- Weergave voor de spelpagina (/): titel en menu's staan daar -->
  <main>
    <div class="panel" id="panel">
      <canvas id="game"></canvas>
      <div class="ploeg" id="ploeg"></div>
      <div class="overlay" id="overlay"><div class="big">VERBINDEN</div><div class="small">radioverbinding maken…</div></div>
    </div>
    <div class="caution"></div>
    <!-- Zijbalk, op elke kaart hetzelfde: je tank, de minikaart, de legenda -->
    <aside>
      <div id="cards" style="padding-top:9px"></div>
      <div class="legend-title" data-minimap>VELDKAART</div>
      <canvas id="mini" width="400" height="250"></canvas>
      <div class="legend-title">TERREIN</div>
      <div class="legend" id="legend"></div>
    </aside>
  </main>
  <script type="module" src="/1944.js"></script>
</body>
</html>
