<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BLITZKRIEG — winter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Black+Ops+One&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --metal: #1c1e20;
      --metal-2: #24272a;
      --edge: #3a3e42;
      --text: #d8d9d4;
      --muted: #9a9d9f;
      --paper: #e3d4b2;
      --paper-2: #d2bf98;
      --ink: #26261f;
      --fuel: #3fbf4a;
      --armour: #2f8fe0;
      --ammo: #f2b51c;
      --empty: #3a3d40;
      --stamp: #d8473a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #111213; color: var(--text);
      font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
      overflow: hidden;
    }
    /* metalen plaat met boutjes in de hoeken */
    .plate {
      background:
        radial-gradient(circle at 12px 12px, #7b7f83 0 2.5px, #26292c 3.5px, transparent 5px),
        radial-gradient(circle at calc(100% - 12px) 12px, #7b7f83 0 2.5px, #26292c 3.5px, transparent 5px),
        radial-gradient(circle at 12px calc(100% - 12px), #7b7f83 0 2.5px, #26292c 3.5px, transparent 5px),
        radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #7b7f83 0 2.5px, #26292c 3.5px, transparent 5px),
        linear-gradient(180deg, var(--metal-2), var(--metal));
      border: 1px solid var(--edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 1px #000;
    }
    .frame {
      height: 100%; display: grid; grid-template-columns: 1fr 18px 320px; gap: 0;
      padding: 8px;
    }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .title {
      flex: none; height: 52px; display: flex; align-items: center; gap: 26px; padding: 0 44px;
      font-weight: 600; letter-spacing: 2px; font-size: 22px; color: var(--text); white-space: nowrap; overflow: hidden;
    }
    .title .logo { font-weight: 700; font-size: 34px; letter-spacing: 2px; color: #e8e6df; text-shadow: 0 2px 0 #000; }
    .title .dash { color: var(--muted); }
    .title .spacer { flex: 1; }
    .title a { font-size: 13px; letter-spacing: 1px; color: var(--muted); text-decoration: none; font-weight: 500; }
    .title a:hover { color: var(--text); }
    .panel { position: relative; flex: 1; min-height: 0; border: 3px solid #0b0c0d; box-shadow: 0 0 0 1px var(--edge); background: #e9eef3; }
    .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .fog {
      position: absolute; top: 12px; left: 14px; z-index: 2; pointer-events: none;
      font-weight: 600; font-size: 14px; letter-spacing: 2px; color: #2b3138;
      background: rgba(240, 244, 248, .75); padding: 3px 10px; border: 1px solid rgba(40,48,56,.35);
    }
    .fog:empty { display: none; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; text-align: center; z-index: 2;
    }
    .overlay:empty { display: none; }
    .overlay .big {
      font-weight: 700; font-size: 52px; letter-spacing: 4px; color: var(--stamp); background: rgba(20,22,24,.78);
      border: 4px solid var(--stamp); padding: 4px 26px; transform: rotate(-3deg);
    }
    .overlay .small { margin-top: 12px; font-size: 18px; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 3px #000; }
    .caution {
      margin: 0 3px;
      background: repeating-linear-gradient(-45deg, #f0b81c 0 10px, #141414 10px 20px);
      border: 1px solid #000;
    }
    aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; padding: 14px 14px 12px; }
    /* tankkaart: precies dezelfde als op de zomerkaarten (1944.html), ook het lettertype */
    .card {
      background: linear-gradient(180deg, #ddd1ad, #d8cba5);
      border: 2px solid #8c7f5b;
      box-shadow: inset 0 0 0 3px #d8cba5, inset 0 0 0 4px #b3a57e, 0 2px 0 #0e0d0b;
      color: #3b3a22; padding: 12px 14px; position: relative;
      font-family: "Special Elite", "Courier New", monospace;
    }
    .card .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .card .name { font-family: "Black Ops One", Impact, sans-serif; font-size: 20px; letter-spacing: 2px; color: #3a4320; }
    .card .wins { text-align: right; font-size: 11px; letter-spacing: 1px; }
    .card .wins b { display: block; font-family: "Black Ops One", Impact, sans-serif; font-size: 24px; font-weight: 400; line-height: 1; }
    .card .row { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; margin-top: 4px; }
    .card .track { height: 9px; background: #c9b98e; border: 1px solid #7e7150; box-shadow: inset 0 1px 0 rgba(0,0,0,.15); }
    .card .fill { height: 100%; transition: width .15s linear; }
    .card .fill.low { animation: blink .5s steps(1) infinite; }
    .card.dead { filter: grayscale(.7) brightness(.8); }
    @keyframes blink { 50% { opacity: .25; } }
    .label { font-weight: 600; font-size: 18px; letter-spacing: 1px; color: var(--text); margin: 6px 2px 4px; }
    #mini { width: 100%; display: block; border: 2px solid #4a4e52; background: #c9ccd0; image-rendering: pixelated; }
    .box {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid #4a4e52; background: #17191b; padding: 6px 14px; font-weight: 700; font-size: 30px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row .box { flex: 0 0 150px; justify-content: center; font-size: 26px; }
    .scores { font-size: 14px; letter-spacing: .5px; color: var(--muted); line-height: 1.7; }
    .scores .sw { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border: 1px solid #000; }
    .scores .me { color: var(--text); }
    /* schakelaar als metalen tuimelschakelaar */
    .toggle {
      display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none;
      font-weight: 600; font-size: 16px; letter-spacing: 1px; color: var(--text);
      border: 1px solid #4a4e52; background: #17191b; padding: 8px 12px;
    }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle span { flex: none; width: 44px; height: 22px; border-radius: 11px; background: var(--empty); position: relative; box-shadow: inset 0 2px 3px rgba(0,0,0,.6); }
    .toggle span::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d8dadc, #7b7f83); transition: left .15s;
    }
    .toggle input:checked + span { background: var(--fuel); }
    .toggle input:checked + span::after { left: 25px; }
    .toggle input:focus-visible + span { outline: 2px solid var(--ammo); outline-offset: 2px; }
    .legend { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; }
    .legend-row { display: contents; }
    .legend-swatch { width: 22px; height: 22px; image-rendering: pixelated; border: 1px solid #0b0c0d; box-shadow: 0 0 0 1px var(--edge); }
    .legend-name { font-size: 12px; line-height: 1.2; color: var(--text); letter-spacing: .3px; }
    .legend-note { font-size: 11px; white-space: nowrap; text-align: right; color: var(--muted); }
    .help { margin-top: auto; font-size: 12px; color: #7d8184; letter-spacing: .5px; line-height: 1.6; font-weight: 500; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .frame { grid-template-columns: 1fr; height: auto; }
      .panel { height: 62vh; }
      .caution { height: 14px; margin: 8px 0; }
      .title { font-size: 15px; gap: 12px; padding: 0 30px; }
      .title .logo { font-size: 26px; }
      .title .place { display: none; }
    }
  </style>
  <link rel="stylesheet" href="/touch.css">
</head>
<body>
  <!-- Weergave voor de spelpagina (/): titel en menu's staan daar -->
  <div class="frame">
    <div class="main">
      <div class="panel" id="panel">
        <canvas id="game"></canvas>
        <div class="fog" id="fog"></div>
        <div class="overlay" id="overlay"><div class="big">VERBINDEN</div><div class="small">radioverbinding maken…</div></div>
      </div>
    </div>
    <div class="caution"></div>
    <!-- Zijbalk, op elke kaart hetzelfde: je tank, de minikaart, de legenda -->
    <aside class="plate">
      <div class="card">
        <div class="top"><span class="name" id="name">—</span><span class="wins">ZEGES<b id="wins">0</b></span></div>
        <div class="row"><span>BRANDSTOF</span><div class="track"><div class="fill" id="fill-fuel" style="background:#4e5a26"></div></div></div>
        <div class="row"><span>PANTSER</span><div class="track"><div class="fill" id="fill-armour" style="background:#8a3a24"></div></div></div>
        <div class="row"><span>MUNITIE</span><div class="track"><div class="fill" id="fill-ammo" style="background:#a2802c"></div></div></div>
      </div>
      <div class="label" data-minimap>VELDKAART</div>
      <canvas id="mini" width="400" height="250"></canvas>
      <div class="label">TERREIN</div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
  <script type="importmap">{ "imports": { "pixi.js": "/vendor/pixi.mjs", "pixi-filters": "/vendor/pixi-filters.mjs", "simplex-noise": "/vendor/simplex-noise.mjs" } }</script>
  <script type="module" src="/1943.js"></script>
</body>
</html>
