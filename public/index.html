<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Op het beginscherm zetten (iPad, Android): zonder browserbalken, liggend -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BLITZKRIEG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- alle lettertypes van de drie stijlen (zomer, winter, woestijn) -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Special+Elite&family=Oswald:wght@500;600;700&family=Stardos+Stencil:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/view.css">
  <link rel="stylesheet" href="/styles/zomer.css">
  <link rel="stylesheet" href="/styles/winter.css">
  <link rel="stylesheet" href="/styles/woestijn.css">
  <link rel="stylesheet" href="/touch.css">
  <style>
    :root { --bg: #15130f; --bar: #24211b; --line: #3d382e; --cream: #e6dcc2; --dim: #9a917c; --red: #d8473a; --gold: #d2a431; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: "Special Elite", "Courier New", monospace; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .bar {
      flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 8px 16px; background: var(--bar); border-bottom: 2px solid var(--line);
    }
    h1 { margin: 0; font: 400 26px/1 "Black Ops One", Impact, sans-serif; letter-spacing: 4px; white-space: nowrap; }
    h1 .rest { color: var(--gold); font-size: 17px; letter-spacing: 2px; }
    .spacer { flex: 1; }
    label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    select, button {
      font: inherit; font-size: 13px; color: var(--cream); background: #171510; border: 1px solid var(--line);
      padding: 4px 8px; border-radius: 3px;
    }
    select:disabled { opacity: .55; }
    button { font-family: "Black Ops One", Impact, sans-serif; letter-spacing: 2px; background: var(--red); border-color: #7a241c; cursor: pointer; padding: 5px 16px; }
    button:hover { filter: brightness(1.1); }
    .info { font-size: 12px; color: var(--dim); white-space: nowrap; }
    .info b { color: var(--cream); font-weight: normal; }
    @media (max-width: 900px) { h1 .rest { display: none; } }
    html, body { overscroll-behavior: none; }
    /* ---------- Lobby ---------- */
    #lobby { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 24px 20px; }
    #lobby[hidden] { display: none; }
    .lobby-body { flex: 1; min-height: 0; display: flex; gap: 24px; overflow: hidden; }
    .lobby-maps { flex: 0 0 280px; display: flex; flex-direction: column; min-height: 0; }
    .lobby-maps h2 { margin: 16px 0 8px; font: 400 13px/1 "Black Ops One", Impact, sans-serif; letter-spacing: 3px; color: var(--dim); }
    .lobby-map-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .lobby-map-item {
      display: flex; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer;
      border: 1px solid transparent; border-radius: 3px; font-size: 13px; transition: background .15s; white-space: nowrap;
    }
    .lobby-map-item:hover { background: rgba(255,255,255,.05); }
    .lobby-map-item.active { background: rgba(216,71,58,.15); border-color: var(--red); }
    .lobby-map-item .si { flex: none; width: 18px; text-align: center; font-size: 13px; }
    .lobby-map-item .yr { flex: none; color: var(--dim); font-size: 11px; }
    .lobby-map-item .mn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .lobby-map-item.off { opacity: .35; pointer-events: none; }
    .lobby-brief { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 0; }
    .lobby-brief h2 { margin: 0 0 4px; font: 400 20px/1.2 "Black Ops One", Impact, sans-serif; letter-spacing: 3px; }
    .lobby-brief .sub { color: var(--dim); font-size: 12px; letter-spacing: 1px; margin-bottom: 16px; }
    .lobby-brief .desc { line-height: 1.65; margin-bottom: 18px; font-size: 14px; max-width: 620px; }
    .lobby-brief .st { font: 400 11px/1 "Black Ops One", Impact, sans-serif; letter-spacing: 2px; color: var(--dim); margin: 14px 0 5px; }
    .lobby-brief .sb { font-size: 13px; line-height: 1.5; }
    .lobby-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .lobby-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; background: rgba(255,255,255,.04); border-radius: 3px; }
    .lobby-swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    .lobby-footer { flex: none; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 12px; }
    .lobby-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .lobby-naam { font: inherit; font-size: 14px; color: var(--cream); background: #171510; border: 1px solid var(--line); padding: 5px 10px; border-radius: 3px; width: 180px; }
    .lobby-naam::placeholder { color: var(--dim); opacity: .6; }
    .lobby-player { display: flex; align-items: center; gap: 5px; font-size: 13px; }
    .lobby-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .lobby-settings { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .lobby-settings label { font-size: 11px; }
    .lobby-start-btn { font-size: 16px !important; padding: 8px 28px !important; }
    #lobby:not(.host) .lobby-map-item { pointer-events: none; cursor: default; }
    #lobby:not(.host) .lobby-map-item:hover { background: none; }
    #lobby:not(.host) .lobby-map-item.active { border-color: var(--line); }
    #lobby:not(.host) .lobby-footer select { pointer-events: none; opacity: .6; }
    #lobby:not(.host) .lobby-settings select { pointer-events: none; opacity: .6; }
    #lobby:not(.host) .lobby-start-btn { display: none; }
    .lobby-guest-label { display: none; font-size: 11px; color: var(--dim); letter-spacing: 1px; font-family: "Black Ops One", Impact, sans-serif; }
    #lobby:not(.host) .lobby-guest-label { display: block; }
    @media (max-width: 700px) {
      .lobby-body { flex-direction: column; overflow-y: auto; }
      .lobby-maps { flex: none; max-height: 200px; }
    }
    /* vast in de hoek rechtsboven, ook als de balk over twee regels loopt */
    .bar { position: relative; padding-right: 330px; }
    .choose { display: flex; align-items: center; gap: 14px; }
    .choose[hidden] { display: none; }
    .corner { position: absolute; top: 6px; right: 16px; display: flex; gap: 8px; }
    #full, #stop { padding: 4px 10px; background: #171510; border-color: var(--line); white-space: nowrap; }
    #stop { color: var(--red); }
    /* staand op tablet of telefoon: eerst draaien */
    .rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    }
    .rotate b { font: 400 28px/1.2 "Black Ops One", Impact, sans-serif; letter-spacing: 3px; color: var(--red); }
    @media (orientation: portrait) and (pointer: coarse) { .rotate { display: flex; } }
    /* telefoon liggend: zo weinig mogelijk balk, de rest is speelveld */
    @media (pointer: coarse) and (max-height: 500px) {
      .bar { padding: 3px 120px 3px 8px; gap: 8px; flex-wrap: nowrap; }
      .choose { gap: 8px; }
      .corner { top: 3px; right: 8px; gap: 4px; }
      h1 { font-size: 16px; letter-spacing: 2px; }
      #full .label { display: none; }
      h1 .rest { display: none; }
      label { font-size: 10px; }
      select, button { font-size: 11px; padding: 2px 4px; }
      .info { font-size: 10px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
    }
  </style>
</head>
<body data-style="zomer">
  <div class="bar">
    <h1>BLITZKRIEG <span class="rest" id="header"></span></h1>
    <!-- alleen voor de host in de wachtkamer; verder staat hier de titel -->
    <span class="choose" id="choose" hidden>
      <label>MAP <select id="map"></select></label>
      <label>KAART <select id="size"></select></label>
      <button id="start">START</button>
    </span>
    <span class="spacer"></span>
    <span class="info" id="info">verbinden…</span>
    <!-- altijd helemaal rechtsboven -->
    <span class="corner">
      <button id="vision" title="zichtveld in beeld aan of uit">ZICHT AAN</button>
      <button id="stop" hidden title="stoppen">STOP</button>
      <button id="full" hidden title="volledig scherm">⛶ <span class="label">VOLLEDIG SCHERM</span></button>
    </span>
  </div>
  <!-- Lobby: kaartlijst, briefing, spelers en instellingen (shell.js vult alles) -->
  <section id="lobby" hidden>
    <div class="lobby-body">
      <div class="lobby-maps"><h2>VELDSLAGEN</h2><div class="lobby-map-list" id="lobby-map-list"></div></div>
      <div class="lobby-brief" id="lobby-brief"></div>
    </div>
    <div class="lobby-footer" id="lobby-controls">
      <div class="lobby-guest-label">GAST — de host kiest de slag</div>
      <div class="lobby-row">
        <label>NAAM <input type="text" class="lobby-naam" id="lobby-naam" maxlength="20" placeholder="jouw naam" autocomplete="off" spellcheck="false"></label>
        <div id="lobby-players" style="display:flex;gap:14px;flex-wrap:wrap"></div>
      </div>
      <div class="lobby-row">
        <label>KAART <select id="lobby-size"></select></label>
        <label>RONDES <select id="lobby-rounds"></select></label>
        <button id="lobby-vision" class="lobby-vision-btn" title="zichtveld in beeld aan of uit">ZICHT AAN</button>
      </div>
      <div class="lobby-settings" id="lobby-settings"></div>
      <button id="lobby-start" class="lobby-start-btn">▶ START</button>
    </div>
  </section>
  <!-- Het speelveld en het zijpaneel; de stijl van de kaart (zomer, winter, woestijn) staat in
       data-style op <body> en kiest het thema (styles/*.css) en de tekenmodule (styles/*.js) -->
  <main class="view" id="view">
    <div class="panel" id="panel">
      <canvas id="game"></canvas>
      <div class="panel-label" id="panel-label"></div>
      <div class="overlay" id="overlay"><div class="big">VERBINDEN</div><div class="small">radioverbinding maken…</div></div>
    </div>
    <div class="caution"></div>
    <!-- Zijbalk, op elke kaart hetzelfde: je tank, de minikaart, de legenda -->
    <aside>
      <div class="card" id="card">
        <div class="top"><span class="who"><span class="name" id="card-name">—</span><span class="nation" id="card-nation"></span></span><span class="wins">ZEGES<b id="card-wins">0</b></span></div>
        <img class="tank" id="card-tank" alt="" hidden>
        <div class="gauge"><span>BRANDSTOF</span><div class="track"><div class="fill fuel" id="fill-fuel"></div></div><span class="num" id="num-fuel"></span></div>
        <div class="gauge"><span>PANTSER</span><div class="track"><div class="fill armour" id="fill-armour"></div></div><span class="num" id="num-armour"></span></div>
        <div class="gauge"><span>MUNITIE</span><div class="track"><div class="fill ammo" id="fill-ammo"></div></div><span class="num" id="num-ammo"></span></div>
      </div>
      <div class="label" data-minimap>VELDKAART</div>
      <canvas id="mini" width="400" height="250"></canvas>
      <div class="label">TERREIN</div>
      <div class="legend" id="legend"></div>
    </aside>
  </main>
  <div class="rotate"><b>DRAAI JE SCHERM</b>BLITZKRIEG speel je liggend.</div>
  <script type="importmap">{ "imports": { "pixi.js": "/vendor/pixi.mjs", "pixi-filters": "/vendor/pixi-filters.mjs", "simplex-noise": "/vendor/simplex-noise.mjs" } }</script>
  <script type="module" src="/shell.js"></script>
</body>
</html>
