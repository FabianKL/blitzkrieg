<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLITZKRIEG — woestijn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1e1810;
      --canvas: #c9b48a;
      --canvas-2: #b9a174;
      --canvas-edge: #6f5c3a;
      --ink: #2e2416;
      --ink-soft: #5b4a30;
      --red: #b3321f;
      --fuel: #d9a520;
      --armour: #b3321f;
      --ammo: #7d8a3a;
      --stencil: "Stardos Stencil", "Black Ops One", Impact, sans-serif;
      --mono: "Courier Prime", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 30% 0%, #2c2316 0%, var(--bg) 65%);
      color: var(--ink); font-family: var(--mono); overflow: hidden;
      display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px;
    }
    /* stof van canvas met een gestikte rand */
    .cloth {
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px),
        linear-gradient(180deg, var(--canvas), var(--canvas-2));
      border: 2px solid var(--canvas-edge);
      box-shadow: inset 0 0 0 4px var(--canvas), inset 0 0 0 5px rgba(70,55,30,.55), 0 3px 0 #0d0a06;
      outline: 1px dashed rgba(70,55,30,.5); outline-offset: -9px;
    }
    header { flex: none; display: flex; align-items: center; gap: 18px; padding: 10px 22px; }
    h1 { margin: 0; font-family: var(--stencil); font-weight: 700; font-size: 38px; letter-spacing: 5px; line-height: 1; color: var(--ink); }
    .sub { font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--ink-soft); }
    .spacer { flex: 1; }
    .stamp {
      font-family: var(--stencil); font-weight: 700; color: var(--red); border: 3px double var(--red);
      padding: 2px 10px; font-size: 15px; letter-spacing: 2px; transform: rotate(-4deg); opacity: .85;
    }
    header a { color: var(--ink-soft); font-size: 12px; text-decoration: none; border-bottom: 1px dotted var(--ink-soft); }
    header a:hover { color: var(--ink); }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 310px; gap: 12px; }
    .panel { position: relative; min-width: 0; min-height: 0; border: 8px solid var(--canvas-2); box-shadow: 0 0 0 2px var(--canvas-edge), 0 0 0 3px #0d0a06; background: #d9be86; }
    .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .panel::after { /* felle zon linksboven, randen in de schaduw */
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,240,200,.16), transparent 55%);
      box-shadow: inset 0 0 70px rgba(60,35,10,.45);
    }
    .overlay {
      position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; text-align: center;
    }
    .overlay:empty { display: none; }
    .overlay .big {
      font-family: var(--stencil); font-weight: 700; font-size: 50px; letter-spacing: 6px; color: var(--red);
      border: 5px double var(--red); padding: 4px 24px; transform: rotate(-4deg); background: rgba(230, 210, 165, .82);
    }
    .overlay .small { margin-top: 14px; font-size: 17px; font-weight: 700; color: #fff7e6; text-shadow: 0 1px 3px #000; }

    aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 16px 16px 14px; }
    .label { font-family: var(--stencil); font-weight: 700; font-size: 15px; letter-spacing: 3px; color: var(--ink-soft); margin-bottom: -6px; }
    .card { background: rgba(255, 245, 220, .35); border: 1px solid rgba(70,55,30,.45); padding: 12px 14px; }
    .card .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card .name { font-family: var(--stencil); font-weight: 700; font-size: 30px; letter-spacing: 2px; line-height: 1; }
    .card .wins { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .card .wins b { display: block; font-family: var(--stencil); font-size: 30px; line-height: 1.1; color: var(--red); }
    .portrait { display: block; width: 150px; height: 120px; margin: 6px auto 4px; }
    .gauge { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 8px; margin-top: 7px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .gauge .track {
      position: relative; height: 14px; background: rgba(46,36,22,.18); border: 1px solid var(--ink-soft);
      background-image: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(46,36,22,.45) calc(10% - 1px) 10%);
    }
    .gauge .fill { position: absolute; inset: 1px auto 1px 1px; width: 0; transition: width .15s linear; }
    .gauge .fill.low { animation: blink .5s steps(1) infinite; }
    .gauge .num { text-align: right; font-size: 12px; }
    @keyframes blink { 50% { opacity: .2; } }
    .mines { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mines div { background: rgba(255, 245, 220, .35); border: 1px solid rgba(70,55,30,.45); padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .mines b { display: block; font-family: var(--stencil); font-size: 26px; line-height: 1.1; }
    .mines .hit b { color: var(--red); }
    .storm {
      background: rgba(255, 245, 220, .35); border: 1px solid rgba(70,55,30,.45); padding: 7px 10px;
      font-family: var(--stencil); font-weight: 700; font-size: 17px; letter-spacing: 1px;
    }
    .storm.alarm { color: #fff; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, #8a2315 12px 24px); animation: blink .5s steps(1) infinite; }
    #mini { width: 100%; display: block; border: 1px solid var(--ink-soft); background: #d6bf8e; }
    .scores { font-size: 13px; font-weight: 700; line-height: 1.7; }
    .scores .sw { display: inline-block; width: 11px; height: 11px; margin-right: 8px; border: 1px solid var(--ink); vertical-align: -1px; }
    /* schakelaar als stoffen schuifje */
    .toggle {
      display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
      font-family: var(--stencil); font-weight: 700; font-size: 14px; letter-spacing: 2px; color: var(--ink);
      background: rgba(255, 245, 220, .35); border: 1px solid rgba(70,55,30,.45); padding: 8px 12px;
    }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle span { flex: none; width: 40px; height: 20px; border: 2px solid var(--ink-soft); background: rgba(46,36,22,.15); position: relative; }
    .toggle span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--ink-soft); transition: left .15s; }
    .toggle input:checked + span { background: var(--fuel); }
    .toggle input:checked + span::after { left: 22px; background: var(--ink); }
    .toggle input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 2px; }
    .legend { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; }
    .legend-row { display: contents; }
    .legend-swatch { width: 22px; height: 22px; image-rendering: pixelated; border: 1px solid var(--canvas-edge); }
    .legend-name { font-size: 12px; line-height: 1.2; color: var(--ink); }
    .legend-note { font-size: 11px; white-space: nowrap; text-align: right; color: var(--ink-soft); }
    .help { margin-top: auto; font-size: 12px; line-height: 1.55; color: var(--ink-soft); }

    @media (max-width: 980px) {
      body { overflow: auto; }
      main { grid-template-columns: 1fr; }
      .panel { height: 62vh; }
      .sub, .stamp { display: none; }
    }
  </style>
</head>
<body>
  <!-- Weergave voor de spelpagina (/): titel en menu's staan daar -->
  <main>
    <div class="panel" id="panel">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay"><div class="big">VERBINDEN</div><div class="small">radioverbinding maken…</div></div>
    </div>
    <!-- Zijbalk, op elke kaart hetzelfde: je tank, de minikaart, de legenda -->
    <aside class="cloth">
      <div class="card">
        <div class="top">
          <div class="name" id="name">—</div>
          <div class="wins">ZEGES<b id="wins">0</b></div>
        </div>
        <div class="gauge">BRANDSTOF<div class="track"><div class="fill" id="g-fuel" style="background:var(--fuel)"></div></div><span class="num" id="n-fuel"></span></div>
        <div class="gauge">PANTSER<div class="track"><div class="fill" id="g-armour" style="background:var(--armour)"></div></div><span class="num" id="n-armour"></span></div>
        <div class="gauge">MUNITIE<div class="track"><div class="fill" id="g-ammo" style="background:var(--ammo)"></div></div><span class="num" id="n-ammo"></span></div>
      </div>
      <div class="label" data-minimap>VELDKAART</div>
      <canvas id="mini" width="400" height="250"></canvas>
      <div class="label">TERREIN</div>
      <div class="legend" id="legend"></div>
    </aside>
  </main>
  <script type="module" src="/1942.js"></script>
</body>
</html>
